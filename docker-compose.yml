name: lead-crm-dev

x-php: &php
  build: .
  env_file: .env
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8080
    DB_CONNECTION: mysql
    # Docker Desktop resolves this to the host; credentials remain in .env.
    DB_HOST: host.docker.internal
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
    - storage:/var/www/html/storage
    - cache:/var/www/html/bootstrap/cache
    - public:/var/www/html/public

services:
  init:
    <<: *php
    command: [lead-crm-init]
  app:
    <<: *php
    depends_on:
      init: {condition: service_completed_successfully}
  web:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
      - storage:/var/www/html/storage:ro
    depends_on: [app]
  db:
    profiles: [isolated-db]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lead_crm_dev
      MYSQL_USER: lead_crm
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-root-development-only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  node:
    image: node:24-bookworm-slim
    working_dir: /var/www/html
    ports: ["127.0.0.1:5174:5173"]
    environment:
      APP_URL: http://localhost:8080
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      - public:/var/www/html/public
      - vendor:/var/www/html/vendor:ro
    command: sh -c 'npm ci && npm run dev -- --config docker/vite.config.js'
    depends_on:
      init: {condition: service_completed_successfully}
  worker:
    <<: *php
    user: www-data
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=90]
    profiles: [background]
    depends_on:
      app: {condition: service_started}
  scheduler:
    <<: *php
    user: www-data
    command: [php, artisan, schedule:work]
    profiles: [background]
    depends_on:
      app: {condition: service_started}

volumes:
  vendor:
  node_modules:
  storage:
  cache:
  public:
  mysql_data:
