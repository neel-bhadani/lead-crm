<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}iframe{border:0;display:block}</style></head>
<body><pre id="results" style="display:none"></pre><script>
const q = new URLSearchParams(location.search)
const w = +q.get('w'), h = +q.get('h')
const f = document.createElement('iframe')
f.width = w; f.height = h
f.src = './index.html?p=' + (q.get('p') || 'leads')
document.body.appendChild(f)
const poll = setInterval(() => {
  const t = f.contentDocument && f.contentDocument.querySelector('#results')
  if (t && t.textContent) { clearInterval(poll); document.querySelector('#results').textContent = t.textContent; document.title = 'DONE' }
}, 100)
</script></body></html>
